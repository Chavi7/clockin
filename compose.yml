# CLOCKIN — Docker Compose configuration
# Start:     docker compose up -d
# Logs:      docker compose logs -f
# Stop:      docker compose down
# Stop+wipe: docker compose down -v   (also deletes the database volume!)
# Rebuild:   docker compose up -d --build

services:
  clockin:
    build: .
    image: clockin:latest
    container_name: clockin
    restart: unless-stopped
    ports:
      # host:container. Defaults to localhost only.
      #
      # A classroom kiosk has to be reachable from the student PCs, so on the
      # lab server either set CLOCKIN_BIND=0.0.0.0 (plain HTTP, USB scanner or
      # typed IDs only) or leave this on localhost and put a reverse proxy in
      # front of it (needed anyway if you want the browser-camera scan mode,
      # which browsers only allow over HTTPS from a non-localhost origin).
      # See docs/RUNBOOK.md.
      - "${CLOCKIN_BIND:-127.0.0.1}:${CLOCKIN_PORT:-5000}:5000"
    environment:
      # CLOCKIN_SECRET is pulled from .env — never commit the real value.
      - CLOCKIN_SECRET=${CLOCKIN_SECRET}
      # Shared secret for the Inventory Manager roster sync API.
      # Must match CLOCKIN_API_KEY set on the inventory-manager container.
      - CLOCKIN_API_KEY=${CLOCKIN_API_KEY}
    volumes:
      # Persist the SQLite database outside the container so it survives rebuilds.
      - clockin-data:/app/data
    networks:
      - ctec-net

volumes:
  clockin-data:
    name: clockin-data

networks:
  ctec-net:
    external: true
